name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Job-level so it's already set during `npm ci`'s postinstall step
      # (which syncs tsconfig.json's @eml/* paths) — not just the later
      # build/test steps.
      EML_REPO: ${{ github.workspace }}/eml-core
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout EML language repo
        uses: actions/checkout@v4
        with:
          repository: kakon77777-commits/efficientnewlanguage
          path: eml-core

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build (typecheck happens separately; this runs corpus + vite + worker + verify-dist)
        run: npm run build

      - run: npx tsc --noEmit

      - name: Worker smoke tests
        run: npm run test:worker

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: this job only needs the pinned `wrangler` binary from
      # node_modules — it never checks out eml-core, so the postinstall
      # tsconfig sync (which needs EML_REPO) would fail here otherwise.
      - run: npm ci --ignore-scripts

      - name: Download dist artifact (deploy the exact artifact build verified — don't rebuild)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          OUTPUT=$(npx wrangler pages deploy dist --project-name=neokpolaris --branch="$BRANCH" --commit-dirty=true)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-z0-9]+\.neokpolaris\.pages\.dev' | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not parse deployment URL from wrangler output"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test the deployed URL
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Smoke testing $URL"

          # Cloudflare Pages propagates a new deployment per-edge-node, not as
          # one global on/off switch — back-to-back requests can land on
          # different PoPs at different rollout states (observed: a /healthz
          # check that already returns 200 does NOT guarantee the very next
          # request, to the same path, also gets the new deployment). So retry
          # each path independently with backoff instead of gating once
          # upfront. -L follows redirects: /docs and /cases correctly 308 to
          # their trailing-slash form (verified against a real Preview
          # deployment) — check the FINAL status, not the redirect's own code.
          #
          # A final status alone is not enough, and this loop proved it. /app
          # answered 308 -> / for weeks; -L followed the bounce to the homepage,
          # got 200, and this check reported "/app -> 200" every single deploy
          # while the workbench was unreachable and the homepage's 示範區 link
          # led back to the homepage. Following a redirect and then grading the
          # page you were redirected TO cannot distinguish "the route works"
          # from "the route no longer exists". So assert where we landed:
          # $path, or $path/ for the routes that legitimately normalise to a
          # trailing slash.
          fail=0
          for path in / /app /terminal /docs /cases /origins /healthz /readyz /version; do
            ok=0
            for attempt in $(seq 1 8); do
              code=$(curl -sL -o /dev/null -w '%{http_code}' "$URL$path")
              final=$(curl -sL -o /dev/null -w '%{url_effective}' "$URL$path")
              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ] \
                 && { [ "$final" = "$URL$path" ] || [ "$final" = "$URL$path/" ]; }; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::$path returned HTTP $code and landed on $final after 8 attempts"
              fail=1
            else
              echo "$path -> $code ($final)"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Smoke test failed — see above"
            exit 1
          fi

      - name: Generate deploy report
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEPLOY_TIMESTAMP: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
        run: node scripts/deploy-report.mjs

      # Only for real production deploys (push to main) — never for PR/preview
      # branches, whose deploy URL is a *.neokpolaris.pages.dev subdomain that
      # wouldn't match efficientnewlanguage.org's registered base_url anyway.
      # Runs only after the smoke test above already confirmed the deploy is
      # actually live, not merely that `wrangler pages deploy` returned 0.
      - name: Notify Continuous Discovery Beacon
        if: github.ref == 'refs/heads/main'
        env:
          BEACON_SUBMIT_TOKEN: ${{ secrets.BEACON_SUBMIT_TOKEN_EML }}
        run: |
          if [ -z "$BEACON_SUBMIT_TOKEN" ]; then
            echo "BEACON_SUBMIT_TOKEN_EML not set - skipping Beacon notification"
            exit 0
          fi
          curl --fail-with-body -sS -X POST "https://beacon.evemiss.com/api/v1/events" \
            -H "Authorization: Bearer $BEACON_SUBMIT_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: efficientnewlanguage-site-deploy-notify/1.0" \
            -d "{\"site_id\":\"efficientnewlanguage_org\",\"url\":\"https://efficientnewlanguage.org/\",\"event_type\":\"updated\",\"content_hash\":\"git-${{ github.sha }}\",\"title\":\"EML site\",\"auto_dispatch\":true}" \
            || echo "::warning::Beacon notification failed - deploy itself succeeded, this is non-fatal"

      - name: Upload deploy report
        uses: actions/upload-artifact@v4
        with:
          name: deploy-report
          path: deploy-report.json
          retention-days: 90
